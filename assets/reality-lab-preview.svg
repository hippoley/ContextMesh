      <text x="18" y="47" fill="#8b96a2" font-size="11">Rank 17 blind spot → MMR rank 2</text>
      <rect x="18" y="68" width="210" height="34" rx="9" fill="#090d10" stroke="#20272e"/>
      <text x="30" y="89" fill="#ff9ba5" font-size="11">outside top-5</text>
      <text x="251" y="89" fill="#4a555f" font-size="13">→</text>
      <rect x="278" y="68" width="210" height="34" rx="9" fill="#090d10" stroke="#20272e"/>
      <text x="290" y="89" fill="#cceaa3" font-size="11">inside top-5</text>
    </g>
    <g transform="translate(550 62)">
      <rect width="535" height="122" rx="16" fill="#0f1318" stroke="#242c34"/>
      <text x="18" y="24" fill="#e2e7ec" font-size="12" font-weight="700">RAGFlow</text>
      <text x="18" y="47" fill="#8b96a2" font-size="11">Context fit 16K → 128K</text>
      <rect x="18" y="68" width="210" height="34" rx="9" fill="#090d10" stroke="#20272e"/>
      <text x="30" y="89" fill="#ff9ba5" font-size="11">max_output bound</text>
      <text x="251" y="89" fill="#4a555f" font-size="13">→</text>
      <rect x="278" y="68" width="210" height="34" rx="9" fill="#090d10" stroke="#20272e"/>
      <text x="290" y="89" fill="#cceaa3" font-size="11">context_length bound</text>
    </g>
  </g>

  <g transform="translate(58 584)">
    <rect x="0" y="0" width="1084" height="1" fill="#242b33"/>
    <text x="0" y="33" fill="#65717d" font-size="10">Click cases · filter failure stages · inspect traces · follow the Reality Delta log</text>
    <rect x="868" y="15" width="216" height="34" rx="10" fill="url(#glow)" opacity=".92"/>
    <text x="976" y="37" text-anchor="middle" fill="#0b1108" font-size="10" font-weight="800">OPEN INTERACTIVE REALITY LAB ↗</text>
  </g>
</g>
</svg>