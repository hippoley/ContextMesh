<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">ContextMesh Interactive Reality Lab</title>
<desc id="d">A premium dark interface preview showing interactive evidence signals, verified cases, and the ContextMesh evidence lifecycle.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080a0d"/><stop offset="1" stop-color="#0c1015"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8f24a"/><stop offset="1" stop-color="#61d8ee"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<circle cx="1030" cy="50" r="170" fill="#61d8ee" opacity=".05" filter="url(#blur)"/>
<circle cx="120" cy="610" r="190" fill="#b8f24a" opacity=".04" filter="url(#blur)"/>

<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <g transform="translate(58 38)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#10150e" stroke="#35402c"/>
    <text x="14" y="18" fill="#b8f24a" font-size="9" font-weight="800" text-anchor="middle">CM</text>
    <text x="42" y="19" fill="#eef2f6" font-size="14" font-weight="750">ContextMesh</text>
    <text x="139" y="19" fill="#65707c" font-size="10">Reality Lab</text>
  </g>
  <g transform="translate(58 118)">
