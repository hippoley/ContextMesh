    <circle cx="336" cy="22" r="4" fill="#b8f24a"/>
    <text x="348" y="26" fill="#829087" font-size="9">verified</text>
    <g transform="translate(20 46)">
      <rect width="63" height="24" rx="12" fill="#121912" stroke="#465244"/><text x="31.5" y="16" text-anchor="middle" fill="#d7e5c2" font-size="9">Cognee</text>
      <rect x="70" width="70" height="24" rx="12" fill="#0b0f13" stroke="#242c34"/><text x="105" y="16" text-anchor="middle" fill="#697480" font-size="9">RAGFlow</text>
      <rect x="147" width="51" height="24" rx="12" fill="#0b0f13" stroke="#242c34"/><text x="172.5" y="16" text-anchor="middle" fill="#697480" font-size="9">Dify</text>
      <rect x="205" width="58" height="24" rx="12" fill="#0b0f13" stroke="#242c34"/><text x="234" y="16" text-anchor="middle" fill="#697480" font-size="9">Mem0</text>
    </g>
    <text x="20" y="96" fill="#697480" font-size="9" letter-spacing="1.2">DECISIVE RANK</text>
    <text x="20" y="142" fill="#f5f7fa" font-size="38" font-weight="780">17</text>
    <text x="82" y="140" fill="#4c5660" font-size="20">→</text>
    <text x="116" y="142" fill="#b8f24a" font-size="38" font-weight="780">2</text>
    <text x="20" y="174" fill="#71808b" font-size="10">MMR moved decisive evidence into top-5 in both fixtures.</text>
    <g transform="translate(20 184)">
      <rect width="66" height="18" rx="6" fill="#0b0f13" stroke="#34402e"/><text x="33" y="12" text-anchor="middle" fill="#c8e4a5" font-size="7">retrieved</text>
      <text x="92" y="12" fill="#3f4852" font-size="8">→</text>
      <rect x="104" width="59" height="18" rx="6" fill="#130d10" stroke="#563139"/><text x="133.5" y="12" text-anchor="middle" fill="#ffa5af" font-size="7">eligible</text>
      <text x="170" y="12" fill="#3f4852" font-size="8">→</text>
      <rect x="182" width="62" height="18" rx="6" fill="#0b0f13" stroke="#34402e"/><text x="213" y="12" text-anchor="middle" fill="#c8e4a5" font-size="7">MMR #2</text>
      <text x="251" y="12" fill="#3f4852" font-size="8">→</text>
      <rect x="263" width="61" height="18" rx="6" fill="#0b0f13" stroke="#34402e"/><text x="293.5" y="12" text-anchor="middle" fill="#c8e4a5" font-size="7">visible</text>
