[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextmesh"
version = "0.15.0"
description = "Full-coverage external context runtime for evaluation over corpora larger than model context windows."
keywords = ["llm", "rag", "context-engineering", "evaluation", "retrieval", "provenance", "agent-memory", "long-context"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ContextMesh Contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docling = ["docling>=2.81"]
rich = ["pypdf>=5", "python-pptx>=1.0", "openpyxl>=3.1", "python-docx>=1.1", "pillow>=10", "pymupdf>=1.24"]
rlm = ["rlms>=0.1"]
litellm = ["litellm>=1.50"]
s3 = ["boto3>=1.35"]
cognee = ["cognee>=1.6,<2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
contextmesh = "contextmesh.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[project.urls]
Homepage = "https://github.com/hippoley/ContextMesh"
Repository = "https://github.com/hippoley/ContextMesh"
Issues = "https://github.com/hippoley/ContextMesh/issues"
Documentation = "https://github.com/hippoley/ContextMesh#readme"
