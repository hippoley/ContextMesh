[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextmesh"
version = "0.10.0"
description = "Full-coverage external context runtime for evaluation over corpora larger than model context windows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ContextMesh Contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docling = ["docling>=2.81"]
rich = ["pypdf>=5", "python-pptx>=1.0", "openpyxl>=3.1", "python-docx>=1.1", "pillow>=10", "pymupdf>=1.24"]
rlm = ["rlms>=0.1"]
litellm = ["litellm>=1.50"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
contextmesh = "contextmesh.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
