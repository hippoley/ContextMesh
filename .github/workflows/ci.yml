name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,rich]'
      - run: pytest -q

  minio-e2e:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      CONTEXTMESH_S3_BUCKET: contextmesh-ci
      CONTEXTMESH_S3_ENDPOINT_URL: http://127.0.0.1:9000
      CONTEXTMESH_S3_REGION: us-east-1
      CONTEXTMESH_MINIO_E2E: "1"
      MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
      MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned MinIO binary
        run: |
          MINIO_URL="https://github.com/minio/minio/releases/download/$MINIO_RELEASE/minio.linux-amd64.$MINIO_RELEASE"
          curl --fail --location --retry 3 --retry-all-errors "$MINIO_URL" -o /tmp/minio
          echo "$MINIO_SHA256  /tmp/minio" | sha256sum --check -
          chmod +x /tmp/minio
          /tmp/minio --version
      - name: Start MinIO
        run: |
          mkdir -p /tmp/contextmesh-minio-data
          MINIO_ROOT_USER=minioadmin \
          MINIO_ROOT_PASSWORD=minioadmin \
            /tmp/minio server /tmp/contextmesh-minio-data --address :9000 \
            >/tmp/contextmesh-minio.log 2>&1 &
          echo $! >/tmp/contextmesh-minio.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/contextmesh-minio.log
          exit 1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,rich,s3]'
      - run: pytest -q tests/test_v14_minio_e2e.py
      - if: always()
        run: cat /tmp/contextmesh-minio.log || true
