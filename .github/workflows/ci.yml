name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,rich]'
      - run: pytest -q


  minio-e2e:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      CONTEXTMESH_S3_BUCKET: contextmesh-ci
      CONTEXTMESH_S3_ENDPOINT_URL: http://127.0.0.1:9000
      CONTEXTMESH_S3_REGION: us-east-1
      CONTEXTMESH_MINIO_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Start MinIO
        run: |
          docker run -d --name contextmesh-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs contextmesh-minio
          exit 1
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,rich,s3]'
      - run: pytest -q tests/test_v14_minio_e2e.py
      - if: always()
        run: docker logs contextmesh-minio || true
