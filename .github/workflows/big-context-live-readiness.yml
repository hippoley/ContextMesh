name: Big Context Live Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/big-context-live-readiness.yml'
      - '.github/workflows/big-context-live-proof.yml'
      - '.github/workflows/big-context-reference-rollback.yml'
      - 'benchmarks/estimate_big_context_live_cost.py'
      - 'benchmarks/build_public_nist_proof.py'
      - 'benchmarks/smoke_live_provider.py'
      - 'benchmarks/summarize_big_context_live_run.py'
      - 'benchmarks/render_gate4_scale_curve.py'
      - 'benchmarks/render_gate5_drift_diff.py'
      - 'benchmarks/decide_big_context_promotion.py'
      - 'benchmarks/update_promotion_lineage.py'
      - 'benchmarks/rollback_promotion_lineage.py'
      - 'benchmarks/validate_recovery_context.py'
      - 'tests/test_v17_recovery_context.py'
      - 'tests/test_v17_reference_rollback.py'
      - 'tests/test_v17_promotion_lineage.py'
      - 'tests/test_v17_promotion_contract.py'
      - 'tests/test_v17_gate5_drift_diff.py'
      - 'tests/test_v17_gate4_curve_artifacts.py'
      - 'tests/test_v17_live_run_manifest.py'
      - 'benchmarks/verify_frozen_public_proof.py'
      - 'src/contextmesh/provider_smoke.py'
      - 'src/contextmesh/diagnostics.py'
      - 'tests/test_execution_contributor_audit.py'
      - 'tests/test_contract_resolution_receipt.py'
      - 'src/contextmesh/big_context_proof.py'
      - 'tests/test_v17_big_context_gates.py'
      - 'tests/test_v17_frozen_proof.py'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check proof entrypoints without making provider calls
        run: |
          set -euo pipefail
          python -m py_compile \
            benchmarks/build_public_nist_proof.py \
            benchmarks/big_context_proof.py \
            benchmarks/estimate_big_context_live_cost.py \
            benchmarks/smoke_live_provider.py \
            benchmarks/summarize_big_context_live_run.py \
            benchmarks/render_gate4_scale_curve.py \
            benchmarks/render_gate5_drift_diff.py \
            benchmarks/decide_big_context_promotion.py \
            benchmarks/update_promotion_lineage.py \
            benchmarks/rollback_promotion_lineage.py \
            benchmarks/validate_recovery_context.py \
            benchmarks/verify_frozen_public_proof.py \
            src/contextmesh/big_context_proof.py \
            src/contextmesh/provider_smoke.py \
            src/contextmesh/judges.py

      - name: Run proof-engine regression tests without provider calls
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,rich]'
          pytest -q \
            tests/test_v17_big_context_gates.py \
            tests/test_v17_frozen_proof.py \
            tests/test_v17_provider_smoke.py \
            tests/test_v17_live_run_manifest.py \
            tests/test_v17_gate4_curve_artifacts.py \
            tests/test_v17_gate5_drift_diff.py \
            tests/test_v17_promotion_contract.py \
            tests/test_v17_promotion_lineage.py \
            tests/test_v17_reference_rollback.py \
            tests/test_v17_recovery_context.py \
            tests/test_execution_contributor_audit.py \
            tests/test_contract_resolution_receipt.py
          test -f benchmarks/big-context/nist-public-corpus.json
          test -f .github/workflows/big-context-live-proof.yml
          test -f .github/workflows/big-context-reference-rollback.yml

      - name: Check authorized provider secret presence
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          dashscope=false
          openai=false
          if [ -n "${DASHSCOPE_API_KEY:-}" ]; then dashscope=true; fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then openai=true; fi

          {
            echo "dashscope_configured=$dashscope"
            echo "openai_configured=$openai"
          } >> "$GITHUB_OUTPUT"

          cat > live-readiness.json <<EOF
          {
            "schema_version": 1,
            "provider_calls_made": 0,
            "model_tokens_billed": 0,
            "dashscope_secret_configured": $dashscope,
            "openai_secret_configured": $openai,
            "preferred_first_route": "qwen3-vl-8b-instruct",
            "preferred_context_tokens": 131072,
            "paid_live_run_triggered": false
          }
          EOF

          echo "DashScope secret configured: $dashscope"
          echo "OpenAI secret configured: $openai"
          echo "No provider call was made."

      - name: Readiness conclusion
        run: |
          cat live-readiness.json
          if [ "${{ steps.secrets.outputs.dashscope_configured }}" != "true" ]; then
            echo "::warning::DASHSCOPE_API_KEY is not configured; Gate 3 cannot start on the preferred route yet."
          else
            echo "Preferred DashScope route is credential-ready. This workflow still makes no model call."
          fi

      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-context-live-readiness
          path: live-readiness.json
          retention-days: 30
