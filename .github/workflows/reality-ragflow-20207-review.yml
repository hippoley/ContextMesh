name: Reality Probe - RAGFlow PR 20207

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reality-ragflow-20207-review.yml'

permissions:
  contents: read

jobs:
  max-token-semantics-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ContextMesh
        uses: actions/checkout@v7
        with:
          path: contextmesh

      - name: Checkout RAGFlow PR 20207 head
        uses: actions/checkout@v7
        with:
          repository: Bruce-Yii/ragflow
          ref: fix/20140-max-tokens-semantics
          path: ragflow

      - uses: actions/setup-go@v6
        with:
          go-version-file: ragflow/go.mod
          cache-dependency-path: ragflow/go.sum


      - name: Add independent PR-head regression
        working-directory: ragflow
        run: |
          cat > internal/service/contextmesh_20207_review_test.go <<'EOF'
          package service

          import (
              "testing"

              "ragflow/internal/entity"
              modelModule "ragflow/internal/entity/models"
          )

          // PR #20207 says tenant_model.extra["max_tokens"] is a context-window
          // override. This pure-function test pins the remaining service-layer
          // semantic leak: applying that tenant extra must not overwrite the
          // catalog's generation max_output.
          func TestContextMeshReview20207_ContextOverrideDoesNotBecomeMaxOutput(t *testing.T) {
              catalogMaxOutput := 16384
              modelInfo := &modelModule.Model{MaxOutput: &catalogMaxOutput}
              tenantModel := &entity.TenantModel{Extra: `{"max_tokens":32000}`}

              resolved, err := modelInfoWithTenantExtra(modelInfo, tenantModel)
              if err != nil {
                  t.Fatalf("modelInfoWithTenantExtra: %v", err)
              }
              if resolved == nil || resolved.MaxOutput == nil {
                  t.Fatal("resolved model info has no max_output")
              }
              if *resolved.MaxOutput != catalogMaxOutput {
                  t.Fatalf(
                      "ModelInfo.MaxOutput = %d, want catalog %d; tenant max_tokens must be context-only",
                      *resolved.MaxOutput, catalogMaxOutput,
                  )
              }
          }
          EOF

      - name: Test PR-head semantic claim
        working-directory: ragflow
        shell: bash
        run: |
          set +e
          CGO_ENABLED=0 go test ./internal/service -run TestContextMeshReview20207_ContextOverrideDoesNotBecomeMaxOutput -count=1 -v 2>&1 | tee /tmp/contextmesh-ragflow-20207.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "PR head already preserves catalog max_output; no review finding."
            exit 0
          fi

          grep -q "ModelInfo.MaxOutput = 32000, want catalog 16384" /tmp/contextmesh-ragflow-20207.log
          echo "Confirmed on PR #20207 head: tenant extra.max_tokens still leaks into generation MaxOutput in the service ModelSolver path."
