name: Reality Probe - RAGFlow PR 20207

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reality-ragflow-20207-review.yml'

permissions:
  contents: read

jobs:
  max-token-semantics-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ContextMesh
        uses: actions/checkout@v7
        with:
          path: contextmesh

      - name: Checkout RAGFlow PR 20207 head
        uses: actions/checkout@v7
        with:
          repository: Bruce-Yii/ragflow
          ref: fix/20140-max-tokens-semantics
          path: ragflow

      - name: Verify remaining PR-head semantic leak
        working-directory: ragflow
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("internal/service/model_service.go").read_text()
          solver = Path("internal/service/model_solver.go").read_text()

          # PR #20207 defines tenant_model.extra["max_tokens"] as a context-window
          # override. These service-layer assignments still give it generation
          # MaxOutput semantics on the PR head.
          required = [
              'MaxTokens    *int     `json:"max_tokens"`',
              "model.MaxOutput = extra.MaxTokens",
              "model.MaxTokens = extra.MaxTokens",
              "return *extra.MaxTokens, nil",
          ]
          for needle in required:
              assert needle in service, f"PR head changed; missing {needle!r}"

          # ResolveModelConfig still feeds that tenant-derived value into
          # ModelTarget.MaxTokens, while ContextLength is resolved separately.
          required_solver = [
              "maxTokens, err = maxTokensFromTenantModelExtra(model.modelEntity, maxTokens)",
              "ContextLength: contextLength",
              "MaxTokens:     maxTokens",
          ]
          for needle in required_solver:
              assert needle in solver, f"PR head changed; missing {needle!r}"

          print(
              "CONFIRMED_20207_REVIEW_GAP",
              "tenant_extra.max_tokens=context_override",
              "remaining_service_effect=ModelInfo.MaxOutput+ModelTarget.MaxTokens",
          )
          PY
