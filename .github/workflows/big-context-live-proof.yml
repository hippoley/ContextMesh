name: Big Context Live Proof

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Live provider route'
        required: true
        default: 'dashscope'
        type: choice
        options:
          - dashscope
          - openai
      dashscope_base_url:
        description: 'Workspace OpenAI-compatible endpoint (no credential)'
        required: true
        default: 'https://llm-i2t8pyfa3dcqmr2r.cn-beijing.maas.aliyuncs.com/compatible-mode/v1'
        type: string
      model:
        description: 'Model name'
        required: true
        default: 'qwen3-vl-8b-instruct'
        type: string
      context_tokens:
        description: 'Declared model context tokens'
        required: true
        default: '131072'
        type: string
      workers:
        description: 'Parallel block inspections'
        required: true
        default: '6'
        type: string
      input_cny_per_million:
        description: 'Input price for cost gate (CNY / 1M tokens); override for selected provider/model'
        required: true
        default: '0.5'
        type: string
      output_cny_per_million:
        description: 'Output price for cost gate (CNY / 1M tokens); override for selected provider/model'
        required: true
        default: '2'
        type: string
      max_estimated_cost_cny:
        description: 'Abort before live calls if conservative estimate exceeds this CNY budget'
        required: true
        default: '80'
        type: string
      smoke_only:
        description: 'Run only the 2-call text + vision provider smoke, then stop'
        required: true
        default: true
        type: boolean
      run_scale:
        description: 'Run Gate 4 after Gate 3 passes (material extra API cost)'
        required: true
        default: false
        type: boolean
      reference_run_id:
        description: 'Optional prior live-proof workflow run ID for Gate 5 drift'
        required: false
        default: ''
        type: string
      promotion_max_cost_ratio:
        description: 'Reject promotion if candidate/reference cost ratio exceeds this'
        required: true
        default: '1.25'
        type: string
      promotion_max_latency_ratio:
        description: 'Reject promotion if candidate/reference latency ratio exceeds this'
        required: true
        default: '1.25'
        type: string
      promotion_max_scale20_recall_drop:
        description: 'Reject promotion if 20x ContextMesh recall drops by more than this fraction'
        required: true
        default: '0.05'
        type: string

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,rich]'

      - name: Rebuild bounded-table NIST v2 corpus and Gate 1-2 artifacts
        run: |
          python benchmarks/build_public_nist_proof.py \
            --workdir /tmp/contextmesh-nist-proof \
            --output-dir /tmp/contextmesh-nist-proof/results \
            --model-context-tokens "${{ inputs.context_tokens }}" \
            --min-corpus-ratio 5 \
            --corpus-id nist-public-big-context-v2 \
            --max-table-block-chars 12000

      - name: Freeze Gate 4 scale plan before any provider call
        run: |
          python benchmarks/plan_gate4_scale.py nist-public-big-context-v2 \
            --store /tmp/contextmesh-nist-proof/store \
            --needles /tmp/contextmesh-nist-proof/results/needle-matrix.json \
            --model-context-tokens "${{ inputs.context_tokens }}" \
            --ratios "1,2,5,10,20" \
            --needle-sample-size 12 \
            --required-max-ratio 20 \
            --require-cross-file \
            --require-all-local-positions \
            --output /tmp/contextmesh-nist-proof/results/gate4-scale-plan.json

      - name: Verify rebuilt corpus and Gate 4 plan against committed frozen evidence
        run: |
          python benchmarks/verify_frozen_public_proof.py \
            --download-manifest /tmp/contextmesh-nist-proof/results/download-manifest.json \
            --gate4-plan /tmp/contextmesh-nist-proof/results/gate4-scale-plan.json \
            --gate1-2-proof benchmarks/results/nist-public-gate1-2-v2-2026-09-28.json \
            --gate4-preflight benchmarks/results/nist-public-gate4-preflight-v2-2026-09-28.json \
            --corpus-manifest /tmp/contextmesh-nist-proof/results/corpus-manifest.json \
            --needle-matrix /tmp/contextmesh-nist-proof/results/needle-matrix.json \
            --task-cases /tmp/contextmesh-nist-proof/results/task-cases.json \
            --output /tmp/contextmesh-nist-proof/results/frozen-proof-verification.json

      - name: Enforce live proof cost budget before any model call
        run: |
          scale_arg=()
          if [ "${{ inputs.run_scale }}" = "true" ]; then
            scale_arg+=(--run-scale --scale-plan /tmp/contextmesh-nist-proof/results/gate4-scale-plan.json)
          fi
          python benchmarks/estimate_big_context_live_cost.py \
            --corpus-manifest /tmp/contextmesh-nist-proof/results/corpus-manifest.json \
            --needles /tmp/contextmesh-nist-proof/results/needle-matrix.json \
            --tasks /tmp/contextmesh-nist-proof/results/task-cases.json \
            --context-tokens "${{ inputs.context_tokens }}" \
            --input-cny-per-million "${{ inputs.input_cny_per_million }}" \
            --output-cny-per-million "${{ inputs.output_cny_per_million }}" \
            --max-estimated-cost-cny "${{ inputs.max_estimated_cost_cny }}" \
            --output /tmp/contextmesh-nist-proof/results/cost-estimate.json \
            "${scale_arg[@]}"

      - name: Configure authorized live model route
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          CONTEXT_TOKENS: ${{ inputs.context_tokens }}
          WORKERS: ${{ inputs.workers }}
          DASHSCOPE_BASE_URL: ${{ inputs.dashscope_base_url }}
        run: |
          if [ "$PROVIDER" = "dashscope" ]; then
            if [ -z "$DASHSCOPE_API_KEY" ]; then
              echo "::error::DASHSCOPE_API_KEY repository secret is required for the live proof."
              exit 2
            fi
            if [[ "$DASHSCOPE_BASE_URL" != https://*/compatible-mode/v1 ]]; then
              echo "::error::dashscope_base_url must be an HTTPS OpenAI-compatible /compatible-mode/v1 endpoint."
              exit 2
            fi
            export PROOF_BASE_URL="$DASHSCOPE_BASE_URL"
            export PROOF_API_ENV="DASHSCOPE_API_KEY"
          elif [ "$PROVIDER" = "openai" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPENAI_API_KEY repository secret is required for the live proof."
              exit 2
            fi
            export PROOF_BASE_URL="https://api.openai.com/v1"
            export PROOF_API_ENV="OPENAI_API_KEY"
          else
            echo "::error::unsupported provider: $PROVIDER"
            exit 2
          fi

          python - <<'PY'
          import os
          from contextmesh.models import ModelRoute
          from contextmesh.store import FileContextStore

          store = FileContextStore("/tmp/contextmesh-nist-proof/store")
          route = ModelRoute(
              id="big-context-live",
              label="Big Context Live Proof",
              provider=os.environ["PROVIDER"],
              base_url=os.environ["PROOF_BASE_URL"],
              model=os.environ["MODEL"],
              api_key_env=os.environ["PROOF_API_ENV"],
              enabled=True,
              max_context_tokens=int(os.environ["CONTEXT_TOKENS"]),
              token_budget_safety_factor=0.90,
              chars_per_token_estimate=1.0,
              capabilities=["text", "table", "vision"],
              max_parallel_requests=int(os.environ["WORKERS"]),
              request_timeout_seconds=180.0,
              deployment="cloud",
          )
          store.upsert_model_route(route)
          print(route.model_dump_json(indent=2))
          PY

      - name: Run 2-call text + vision provider smoke
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          DASHSCOPE_BASE_URL: ${{ inputs.dashscope_base_url }}
        run: |
          if [ "$PROVIDER" = "dashscope" ]; then
            base_url="$DASHSCOPE_BASE_URL"
            api_env="DASHSCOPE_API_KEY"
          else
            base_url="https://api.openai.com/v1"
            api_env="OPENAI_API_KEY"
          fi

          python benchmarks/smoke_live_provider.py \
            --base-url "$base_url" \
            --model "$MODEL" \
            --api-key-env "$api_env" \
            --output /tmp/contextmesh-nist-proof/results/provider-smoke.json

      - name: Smoke-only stop marker
        if: ${{ inputs.smoke_only }}
        run: |
          echo "PROVIDER_SMOKE_ONLY_COMPLETE"
          echo "The full Gate 3 proof was intentionally not started."

      - name: Download Gate 5 reference snapshot
        if: ${{ !inputs.smoke_only && inputs.reference_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reference_run_id }}
          name: big-context-live-proof-${{ inputs.reference_run_id }}
          path: /tmp/contextmesh-reference

      - name: Run Gate 3 live proof
        if: ${{ !inputs.smoke_only && !inputs.run_scale }}
        run: |
          extra=()
          if [ -f /tmp/contextmesh-reference/live-proof.snapshot.json ]; then
            extra+=(--drift-reference /tmp/contextmesh-reference/live-proof.snapshot.json)
          fi
          python benchmarks/big_context_proof.py nist-public-big-context-v2 \
            --store /tmp/contextmesh-nist-proof/store \
            --route-id big-context-live \
            --needles /tmp/contextmesh-nist-proof/results/needle-matrix.json \
            --tasks /tmp/contextmesh-nist-proof/results/task-cases.json \
            --model-context-tokens "${{ inputs.context_tokens }}" \
            --workers "${{ inputs.workers }}" \
            --skip-scale \
            --run-id "github-${{ github.run_id }}" \
            --model-version "${{ inputs.model }}" \
            --output /tmp/contextmesh-nist-proof/results/live-proof.json \
            --snapshot-output /tmp/contextmesh-nist-proof/results/live-proof.snapshot.json \
            "${extra[@]}"

      - name: Run Gate 3 + Gate 4 scale proof
        if: ${{ !inputs.smoke_only && inputs.run_scale }}
        run: |
          extra=()
          if [ -f /tmp/contextmesh-reference/live-proof.snapshot.json ]; then
            extra+=(--drift-reference /tmp/contextmesh-reference/live-proof.snapshot.json --require-all-gates)
          fi
          python benchmarks/big_context_proof.py nist-public-big-context-v2 \
            --store /tmp/contextmesh-nist-proof/store \
            --route-id big-context-live \
            --needles /tmp/contextmesh-nist-proof/results/needle-matrix.json \
            --tasks /tmp/contextmesh-nist-proof/results/task-cases.json \
            --model-context-tokens "${{ inputs.context_tokens }}" \
            --workers "${{ inputs.workers }}" \
            --ratios "1,2,5,10,20" \
            --scale-plan /tmp/contextmesh-nist-proof/results/gate4-scale-plan.json \
            --task-sample-size 0 \
            --run-id "github-${{ github.run_id }}" \
            --model-version "${{ inputs.model }}" \
            --output /tmp/contextmesh-nist-proof/results/live-proof.json \
            --snapshot-output /tmp/contextmesh-nist-proof/results/live-proof.snapshot.json \
            "${extra[@]}"

      - name: Render Gate 5 drift diff artifacts
        if: always()
        run: |
          if [ -f /tmp/contextmesh-reference/live-proof.json ] && [ -f /tmp/contextmesh-nist-proof/results/live-proof.json ]; then
            python benchmarks/render_gate5_drift_diff.py \
              --reference-proof /tmp/contextmesh-reference/live-proof.json \
              --candidate-proof /tmp/contextmesh-nist-proof/results/live-proof.json \
              --json /tmp/contextmesh-nist-proof/results/gate5-drift-diff.json \
              --markdown /tmp/contextmesh-nist-proof/results/gate5-drift-diff.md
          elif [ -n "${{ inputs.reference_run_id }}" ]; then
            printf '# Gate 5 Drift Diff\n\nStatus: **NOT COMPARABLE**\n\nReference or candidate proof artifact unavailable.\n' \
              > /tmp/contextmesh-nist-proof/results/gate5-drift-diff.md
          fi

      - name: Decide candidate promotion
        if: always()
        run: |
          if [ -f /tmp/contextmesh-nist-proof/results/gate5-drift-diff.json ]; then
            python benchmarks/decide_big_context_promotion.py \
              --drift-diff /tmp/contextmesh-nist-proof/results/gate5-drift-diff.json \
              --json /tmp/contextmesh-nist-proof/results/promotion-decision.json \
              --markdown /tmp/contextmesh-nist-proof/results/promotion-decision.md \
              --max-cost-ratio "${{ inputs.promotion_max_cost_ratio }}" \
              --max-latency-ratio "${{ inputs.promotion_max_latency_ratio }}" \
              --max-scale20-recall-drop "${{ inputs.promotion_max_scale20_recall_drop }}"
          elif [ -n "${{ inputs.reference_run_id }}" ]; then
            printf '# Promotion Decision\n\nDecision: **HOLD**\n\n- comparable Gate 5 drift artifact unavailable\n' \
              > /tmp/contextmesh-nist-proof/results/promotion-decision.md
          fi

      - name: Append verified promotion lineage
        if: always()
        run: |
          if [ -f /tmp/contextmesh-nist-proof/results/promotion-decision.json ]; then
            prior=()
            if [ -f /tmp/contextmesh-reference/promotion-lineage.json ]; then
              prior+=(--prior-lineage /tmp/contextmesh-reference/promotion-lineage.json)
            fi
            python benchmarks/update_promotion_lineage.py \
              --decision /tmp/contextmesh-nist-proof/results/promotion-decision.json \
              "${prior[@]}" \
              --expected-reference-run-id "github-${{ inputs.reference_run_id }}" \
              --expected-candidate-run-id "github-${{ github.run_id }}" \
              --candidate-git-sha "${{ github.sha }}" \
              --json /tmp/contextmesh-nist-proof/results/promotion-lineage.json \
              --markdown /tmp/contextmesh-nist-proof/results/promotion-lineage.md
          fi

      - name: Render Gate 4 curve artifacts
        if: always()
        run: |
          if [ -f /tmp/contextmesh-nist-proof/results/live-proof.json ]; then
            python benchmarks/render_gate4_scale_curve.py \
              --proof /tmp/contextmesh-nist-proof/results/live-proof.json \
              --csv /tmp/contextmesh-nist-proof/results/gate4-scale-curve.csv \
              --markdown /tmp/contextmesh-nist-proof/results/gate4-scale-curve.md
          else
            printf '# Gate 4 Scale Curve\n\nStatus: **NOT RUN**\n' \
              > /tmp/contextmesh-nist-proof/results/gate4-scale-curve.md
          fi

      - name: Summarize live run artifact
        if: always()
        run: |
          mkdir -p /tmp/contextmesh-nist-proof/results
          python benchmarks/summarize_big_context_live_run.py \
            --result-dir /tmp/contextmesh-nist-proof/results \
            --output /tmp/contextmesh-nist-proof/results/live-run-manifest.json \
            --run-id "${{ github.run_id }}" \
            --git-sha "${{ github.sha }}" \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}" \
            --context-tokens "${{ inputs.context_tokens }}" \
            --workers "${{ inputs.workers }}" \
            --smoke-only "${{ inputs.smoke_only }}" \
            --run-scale "${{ inputs.run_scale }}" \
            --reference-run-id "${{ inputs.reference_run_id }}"

      - name: Show live proof result
        if: always()
        run: |
          cat /tmp/contextmesh-nist-proof/results/live-run-manifest.json 2>/dev/null || true
          cat /tmp/contextmesh-nist-proof/results/live-proof.json 2>/dev/null || true

      - name: Upload live proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-context-live-proof-${{ github.run_id }}
          path: /tmp/contextmesh-nist-proof/results/
          if-no-files-found: warn
          retention-days: 90
