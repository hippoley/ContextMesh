name: Reality Probe - RAGFlow D24

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reality-ragflow-d24.yml'

permissions:
  contents: read

jobs:
  chat-context-window:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ContextMesh
        uses: actions/checkout@v7
        with:
          path: contextmesh

      - name: Checkout current RAGFlow main
        uses: actions/checkout@v7
        with:
          repository: infiniflow/ragflow
          ref: main
          path: ragflow

      - name: Prove D24 from current-main executable code path
        working-directory: ragflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("conf/models/openai.json").read_text())
          models = catalog["models"] if isinstance(catalog, dict) else catalog
          gpt4o = next(m for m in models if m.get("name") == "gpt-4o")
          context_length = gpt4o.get("context_length")
          max_output = gpt4o.get("max_output")

          assert context_length == 128000, context_length
          assert max_output == 16384, max_output

          solver = Path("internal/service/model_solver.go").read_text()
          pipeline = Path("internal/service/chat_pipeline.go").read_text()

          required_solver = [
              "ContextLength int",
              "MaxTokens     int",
              "ContextLength: contextLength",
              "MaxTokens:     maxTokens",
          ]
          for needle in required_solver:
              assert needle in solver, f"model solver shape changed: missing {needle!r}"

          # Current D24 path:
          # 1. getLLMModelConfig passes target.MaxTokens into buildLLMModelConfig.
          # 2. buildLLMModelConfig exposes that value as cfg[\"max_tokens\"].
          # 3. AsyncChat reads cfg[\"max_tokens\"] into modelMaxTokens.
          # 4. messageFitIn uses modelMaxTokens as its 95% input/context budget.
          required_pipeline = [
              "target.Driver, target.ModelName, target.APIConfig, target.MaxTokens",
              '"max_tokens":  maxTokens',
              'llmModelConfig["max_tokens"]',
              "modelMaxTokens = mt",
              "messageFitIn(llmMessages, int(float64(modelMaxTokens)*0.95))",
          ]
          for needle in required_pipeline:
              assert needle in pipeline, f"chat pipeline shape changed: missing {needle!r}"

          if "target.ContextLength" in pipeline[pipeline.find("func (s *ChatPipelineService) getLLMModelConfig"):pipeline.find("func reasoningNeedsAgenticGraph")]:
              raise AssertionError("getLLMModelConfig now consumes target.ContextLength; re-evaluate D24")

          print(
              "CONFIRMED_D24",
              f"catalog_context={context_length}",
              f"catalog_max_output={max_output}",
              "chat_fit_source=target.MaxTokens",
              f"effective_fit_budget={max_output}",
          )
          PY
