name: Pages

# One-time prerequisite:
# Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
# Until then this workflow exits cleanly with a notice.
# After enablement, every public-site change publishes automatically.
on:
  push:
    branches: [main]
    paths:
      - 'site/reality.html'
      - 'assets/contextmesh-social-preview.png'
      - 'scripts/check_reality_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public Reality Lab
        run: python scripts/check_reality_site.py

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Open Settings -> Pages and set Source to GitHub Actions once. Future public-site changes will then deploy automatically."
          fi

      - name: Build public Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        run: |
          rm -rf .pages
          mkdir -p .pages/assets

          # The public Pages root is the Reality Lab, not the backend-dependent
          # runtime workspace served from site/index.html.
          cp site/reality.html .pages/index.html
          cp site/reality.html .pages/reality.html
          cp assets/contextmesh-social-preview.png .pages/assets/contextmesh-social-preview.png

          # Avoid Jekyll processing and make the public artifact explicit.
          touch .pages/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: .pages

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'

      - name: Publish URL
        if: steps.pages.outputs.enabled == 'true'
        run: echo "Published to https://hippoley.github.io/ContextMesh/"
