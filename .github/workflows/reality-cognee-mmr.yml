name: Reality Probe - Cognee MMR PR

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reality-cognee-mmr.yml'
      - 'benchmarks/cognee_mmr_rank17_probe.py'
      - 'benchmarks/cognee_pr3707_mmr_replay.py'

permissions:
  contents: read

jobs:
  released-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ContextMesh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install released Cognee 1.6.0
        run: pip install 'cognee[gliner]==1.6.0'
      - name: Run released CHUNKS baseline and export embedding fixture
        run: |
          python benchmarks/cognee_mmr_rank17_probe.py \
            --mode chunks \
            --source released-cognee-1.6.0 \
            --top-k 5 \
            --fetch-k 50 \
            --crowding 16 \
            --output released.json
      - uses: actions/upload-artifact@v4
        with:
          name: cognee-released-chunks
          path: released.json

  pr3707-mmr:
    needs: released-chunks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: cognee-released-chunks
          path: results/released
      - name: Checkout exact Cognee PR 3707 source
        uses: actions/checkout@v7
        with:
          repository: CrypticCortex/cognee
          ref: d1625f2a87e562da2ae95242f00b0a1866c2209b
          path: .upstream/cognee-pr3707
      - name: Replay exact PR 3707 mmr_select on released Cognee embeddings
        run: |
          python benchmarks/cognee_pr3707_mmr_replay.py \
            --baseline results/released/released.json \
            --pr-source .upstream/cognee-pr3707/cognee/modules/retrieval/mmr_retriever.py \
            --top-k 5 \
            --lambda-mult 0.5 \
            --output mmr.json
      - uses: actions/upload-artifact@v4
        with:
          name: cognee-pr3707-mmr
          path: mmr.json

  compare:
    needs: [released-chunks, pr3707-mmr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cognee-released-chunks
          path: results/released
      - uses: actions/download-artifact@v4
        with:
          name: cognee-pr3707-mmr
          path: results/mmr
      - name: Build combined result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          released = json.loads(Path("results/released/released.json").read_text())
          mmr = json.loads(Path("results/mmr/mmr.json").read_text())
          by_scenario = {}
          for row in released["results"]:
              by_scenario.setdefault(row["scenario"], {})["released_chunks"] = row
          for row in mmr["results"]:
              by_scenario.setdefault(row["scenario"], {})["pr3707_mmr"] = row

          comparisons = []
          for scenario, pair in sorted(by_scenario.items()):
              base = pair["released_chunks"]
              candidate = pair["pr3707_mmr"]
              comparisons.append({
                  "scenario": scenario,
                  "released_decisive_rank": base["decisive_rank"],
                  "mmr_decisive_rank": candidate["decisive_rank"],
                  "released_top5_contains_decisive": base["top_k_contains_decisive"],
                  "mmr_top5_contains_decisive": candidate["top_k_contains_decisive"],
                  "released_mean_pairwise_cosine": base["top_k_redundancy"]["mean_cosine"],
                  "mmr_mean_pairwise_cosine": candidate["top_k_redundancy"]["mean_cosine"],
                  "released_max_pairwise_cosine": base["top_k_redundancy"]["max_cosine"],
                  "mmr_max_pairwise_cosine": candidate["top_k_redundancy"]["max_cosine"],
                  "released_contradiction_available": base["contradiction_available_at_cutoff"],
                  "mmr_contradiction_available": candidate["contradiction_available_at_cutoff"],
              })

          combined = {
              "kind": "contextmesh-cognee-mmr-rank17-comparison",
              "baseline": {
                  "source": released["source"],
                  "cognee_version": released["cognee_version"],
                  "execution": "live SearchType.CHUNKS on Cognee 1.6.0",
              },
              "candidate": {
                  "source": "exact mmr_select() source extracted from Cognee PR #3707",
                  "execution": "algorithm replay over the exact released-Cognee candidate order and embeddings",
                  "upstream_pr": "https://github.com/topoteretes/cognee/pull/3707",
                  "head_sha": "d1625f2a87e562da2ae95242f00b0a1866c2209b",
              },
              "comparisons": comparisons,
              "integration_observation": (
                  "The unrebased PR head cannot be compared end-to-end without an LLM key because its "
                  "remember() API predates the current keyless/extractor path; the exact pure MMR selector "
                  "is therefore replayed over the released baseline embeddings instead."
              ),
              "interpretation_rule": (
                  "Treat MMR as improving this fixture only when the decisive source becomes "
                  "eligible at top-5 and/or redundancy falls; do not generalize beyond these controlled corpora."
              ),
          }
          Path("cognee-mmr-comparison.json").write_text(
              json.dumps(combined, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(combined, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cognee-mmr-comparison
          path: cognee-mmr-comparison.json
