name: Bootstrap ContextMesh source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for all archive parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat .bootstrap/parts-count 2>/dev/null || echo 0)"
          actual="$(find .bootstrap -maxdepth 1 -name 'cmzip.part.*' -type f | wc -l | tr -d ' ')"
          echo "expected=$expected actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruct and verify archive
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/cmzip.part.* | base64 -d > /tmp/contextmesh.zip
          expected="$(cat .bootstrap/sha256)"
          actual="$(sha256sum /tmp/contextmesh.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p /tmp/contextmesh-src
          unzip -q /tmp/contextmesh.zip -d /tmp/contextmesh-src
      - name: Replace bootstrap tree with ContextMesh source
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/contextmesh-src/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import ContextMesh v0.10 standalone runtime"
          git push origin HEAD:main
